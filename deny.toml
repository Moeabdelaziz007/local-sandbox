[advisories]
ignore = [
  # Transitive through ratatui's instability dependency. It is acceptable for
  # the initial TUI scaffold; revisit when the TUI grows beyond a placeholder.
  "RUSTSEC-2024-0436",
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
