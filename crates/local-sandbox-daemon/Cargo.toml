[package]
name = "local-sandbox-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
s3-contract = [
  "dep:aws-credential-types",
  "dep:aws-sdk-s3",
  "dep:aws-smithy-async",
  "dep:aws-smithy-checksums",
  "dep:aws-smithy-eventstream",
  "dep:aws-smithy-http",
  "dep:aws-smithy-http-client",
  "dep:aws-smithy-json",
  "dep:aws-smithy-observability",
  "dep:aws-smithy-runtime",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
  "dep:aws-smithy-xml",
  "dep:crc-fast",
]
kv-contract = ["dep:redis"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
local-sandbox-core = { path = "../local-sandbox-core" }
local-sandbox-services = { path = "../local-sandbox-services" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
aws-credential-types = { version = "=1.2.11", optional = true }
aws-sdk-s3 = { version = "=1.122.0", default-features = false, features = [
  "default-https-client",
  "http-1x",
  "rt-tokio",
  "sigv4a",
], optional = true }
aws-smithy-async = { workspace = true, optional = true }
aws-smithy-checksums = { workspace = true, optional = true }
aws-smithy-eventstream = { workspace = true, optional = true }
aws-smithy-http = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, features = [
  "rustls-aws-lc",
], optional = true }
aws-smithy-json = { workspace = true, optional = true }
aws-smithy-observability = { workspace = true, optional = true }
aws-smithy-runtime = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
aws-smithy-xml = { workspace = true, optional = true }
crc-fast = { workspace = true, optional = true }
reqwest = { version = "0.12.28", default-features = false }
redis = { workspace = true, optional = true }

[[test]]
name = "s3_contract"
path = "tests/s3_contract.rs"
required-features = ["s3-contract"]

[[test]]
name = "kv_contract"
path = "tests/kv_contract.rs"
required-features = ["kv-contract"]

[dev-dependencies]
tower.workspace = true
