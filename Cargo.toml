[workspace]
members = [
  "crates/local-sandbox-core",
  "crates/local-sandbox-protocol",
  "crates/local-sandbox-vfkit",
  "crates/local-sandbox-services",
  "crates/local-sandbox-daemon",
  "crates/local-sandbox-cli",
  "crates/local-sandbox-tui",
  "crates/local-sandbox-web",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/vercel-labs/local-sandbox"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
anyhow = "1.0.98"
aws-smithy-async = "=1.2.11"
aws-smithy-checksums = "=0.64.3"
aws-smithy-eventstream = "=0.60.18"
aws-smithy-http = "=0.63.3"
aws-smithy-http-client = "=1.1.9"
aws-smithy-json = "=0.62.3"
aws-smithy-observability = "=0.2.4"
aws-smithy-runtime = "=1.10.0"
aws-smithy-runtime-api = "=1.11.3"
aws-smithy-types = "=1.4.3"
aws-smithy-xml = "=0.60.13"
axum = "0.8.4"
base64 = "0.22.1"
clap = { version = "4.5.38", features = ["derive", "env"] }
crc-fast = "=1.9.0"
hyper-util = "0.1.20"
ratatui = "0.29.0"
s3s = "=0.13.0-alpha.3"
s3s-fs = "=0.13.0-alpha.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
] }
tower-http = { version = "0.6.4", features = ["cors", "trace"] }
tower = "0.5.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.17.0", features = ["serde", "v4"] }
